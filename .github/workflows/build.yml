name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register MSVC problem matcher
        run: echo "::add-matcher::.github/msvc-matcher.json"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content configure.log | Select-Object -Last 40 | ForEach-Object { Write-Output "::error title=configure::$_" }
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release -- /m /nologo /v:minimal 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': (fatal )?error ' | Select-Object -First 40 | ForEach-Object { Write-Output "::error title=build::$($_.Line)" }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/SectorForge.exe dist/
          # app-local VC runtime so it runs without installing the redistributable
          Copy-Item "$env:SystemRoot\System32\vcruntime140.dll" dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath SectorForge-windows-x64.zip -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SectorForge-windows-x64
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SectorForge-windows-x64.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use the runner's NDK
        run: |
          echo "SF_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
          echo "SF_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain > build.log 2>&1
          status=$?
          tail -n 60 build.log
          if [ $status -ne 0 ]; then
            grep -E '(error|Error|ERROR)[: ]' build.log | grep -v 'warning' | head -n 40 | while IFS= read -r line; do echo "::error title=android::$line"; done
            exit $status
          fi
          cp app/build/outputs/apk/release/app-release.apk ../SectorForge-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SectorForge-android
          path: SectorForge-android.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SectorForge-android.apk

  android-smoke:
    name: Android emulator smoke test
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SectorForge-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh .github/android-smoke.sh
      - name: Report
        run: |
          echo "::notice title=pid::$(cat shots/pid.txt)"
          grep -E "FATAL|AndroidRuntime: |signal [0-9]+|Abort" shots/logcat.txt | head -n 20 | while IFS= read -r l; do echo "::warning title=logcat::$l"; done
          grep -E "SectorForge" shots/logcat.txt | head -n 10 | while IFS= read -r l; do echo "::notice title=log::$l"; done
      - name: Publish screenshots to the ci-shots branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd shots
          git init -q
          git checkout -q -b ci-shots
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Emulator smoke test ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots

  mobile-tests:
    name: Touch shell tests (Linux, Mesa GLES)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa GLES, fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri fonts-inter fonts-dejavu-core python3-pil > /dev/null
      - name: Build and run
        env:
          SF_GL_INC: ' '
          SF_SHOTS: '1'
        run: sh tests/run_mobile.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: /tmp/mshots/*.png

  core-tests:
    name: Map core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          gcc -std=c11 -Wall -Wextra -O1 -g -fsanitize=address,undefined tests/test_map.c src/map.c src/mapio.c src/base.c -lm -o test_map
          ASAN_OPTIONS=detect_leaks=0 ./test_map
