name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register MSVC problem matcher
        run: echo "::add-matcher::.github/msvc-matcher.json"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release -- /m /nologo /v:minimal

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/SectorForge.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath SectorForge-windows-x64.zip -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SectorForge-windows-x64
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SectorForge-windows-x64.zip

  core-tests:
    name: Map core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          gcc -std=c11 -Wall -Wextra -O1 -g -fsanitize=address,undefined tests/test_map.c src/map.c src/mapio.c src/base.c -lm -o test_map
          ASAN_OPTIONS=detect_leaks=0 ./test_map
